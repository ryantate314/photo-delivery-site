@if (isLoading()) {
  <div class="flex flex-col items-center justify-center min-h-[60vh]">
    <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-500 border-solid mb-4"></div>
    <p class="text-lg text-gray-600">Loading...</p>
  </div>
}
@else {
@if (album(); as album) {
  <div class="max-w-3xl mx-auto p-6 bg-white rounded-xl shadow-lg mt-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-2 md:mb-0">Your Photos</h2>
      <a [href]="album.downloadUrl" target="_blank" class="inline-block px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">Download Album</a>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
    @for (photo of album.photos; track $index) {
      <div class="photo flex flex-col items-center bg-gray-50 rounded-lg p-3 shadow hover:shadow-md transition">
        <a [href]="photo.downloadUrl" target="_blank" class="mb-2 text-blue-600 hover:underline">Download</a>
        <img [src]="photo.thumbnailUrl" class="w-24 h-24 object-cover rounded-md border border-gray-200 shadow-sm"/>
      </div>
    }
    </div>
  </div>
}
@else {
  <div class="flex flex-col h-full items-center">
    <div class="flex flex-col items-center justify-center min-h-[30vh] bg-gradient-to-br from-blue-50 to-white rounded-xl shadow-lg max-w-lg">
      <h1 class="text-2xl text-center font-bold text-gray-800 mb-2">We're Still Editing Your Photos</h1>
      <p class="text-gray-600 text-lg mb-2">Please check back later.</p>
    </div>
  </div>
}
}
